name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Deployment is manual, on the server:
#   cd /var/www/medaghar.com && git pull && \
#   sudo -u deploy -H bash -c 'npm ci && npx prisma migrate deploy && npm run build && pm2 reload medaghar'
# The old deploy job pulled and reloaded without building on the server, so the
# running app would have served new code against an old .next build.

env:
  # CI never touches production data. prisma generate only needs the variable
  # to exist; the build job points it at its own throwaway Postgres.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medaghar_ci
  NEXTAUTH_SECRET: ci-only-not-a-real-secret
  NEXTAUTH_URL: http://localhost:3000

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    services:
      # Sitemaps and location pages query the database at build time.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medaghar_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
